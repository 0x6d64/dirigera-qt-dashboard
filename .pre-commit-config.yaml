# Install once per clone: uv run pre-commit install --install-hooks
# Tool hooks run through `uv run`, so they use the versions pinned in uv.lock.
# doc/upstream-pr/ holds files meant for another project (a patch, JSON traces):
# no hook may rewrite them.
exclude: ^doc/upstream-pr/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml

  - repo: local
    hooks:
      - id: black
        name: black
        entry: uv run black
        language: system
        types: [python]
      - id: ruff
        name: ruff
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy .
        language: system
        types: [python]
        pass_filenames: false
      # Slower than the rest, so it runs on push instead of every commit.
      - id: pytest
        name: pytest (fast)
        entry: uv run pytest -q -m "not slow and not hardware"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
