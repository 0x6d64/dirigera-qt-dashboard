[project]
name = "dirigera-qt-dashboard"
version = "0.1.0"
description = "A PyQt based dashboard for IKEA Dirigera hubs"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["dirigera", "ikea", "smart-home", "dashboard", "pyqt6"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Home Automation",
]
dependencies = [
    "dirigera>=1.6.1",
    "getmac>=0.9.6",
    "netifaces2>=0.0.22",
    "pyqt6>=6.12.1",
]

[project.scripts]
dirigera-dashboard = "main:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["dashboard", "main", "network_discovery", "settings", "theme"]
packages = ["widgets"]

[dependency-groups]
dev = [
    "black>=26.10.1",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-requests>=2.31.0",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running test; CI runs it on master only",
    "hardware: needs a real DIRIGERA hub; never run in CI",
]
